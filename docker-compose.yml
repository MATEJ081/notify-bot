version: "3.8"

services:
  notify-bot:
    build: .
    container_name: notify-bot-mcp
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Load from .env file
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DRY_RUN: ${DRY_RUN:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
      DEDUP_WINDOW_SECONDS: ${DEDUP_WINDOW_SECONDS:-300}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-5000}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
